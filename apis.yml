x-discovery-notes:
  checked: '2026-09-12'
  contract_discovery:
  - finding: >-
      A real OpenAPI 3.0.1 is served on a gartner.com host — Buyer Discovery API v1 (8
      operations) and v2 (11 operations) at
      https://datainsights.gartner.com/api/buyerdiscovery/swagger/v1/swagger.json and
      /v2/swagger.json, HTTP 200 application/json. It was NOT saved to this repository:
      by the STEP 0c ownership rule the spec is judged on what it says about itself, and
      it says it belongs to G2. Its own info.description sends readers to
      https://datainsights.g2digitalmarkets.com/buyerDiscovery/usageGuidelines, gives
      help@g2digitalmarkets.com as the support address, and tells callers to "Contact
      your G2 Digital Markets customer service representative" for credentials. The host
      root 302s to https://datainsights.g2digitalmarkets.com/. G2 announced the
      acquisition of Capterra, Software Advice and GetApp from Gartner on 2026-01-29 and
      closed it on 2026-02-05; the gartner.com hostname is a transitional alias over G2's
      estate. Crediting Gartner with this contract would be the Leadpages defect again.
    url: https://datainsights.gartner.com/api/buyerdiscovery/swagger/v2/swagger.json
    status: 200
    belongs_to: g2
  - finding: >-
      gapi.gartner.com is a live first-party Gartner API host — AWS API Gateway behind
      CloudFront — that answers every path with HTTP 403 {"message":"Missing
      Authentication Token"}. An API exists; no contract, reference or auth documentation
      for it is published anywhere public.
    url: https://gapi.gartner.com/
    status: 403
  - finding: >-
      No A2A agent card, MCP server, GraphQL endpoint, AsyncAPI, WSDL, .proto, OGC
      surface, Postman workspace, first-party SDK on npm/PyPI, public status page or
      public GitHub organisation was found for Gartner. status.gartner.com does not
      answer from the public internet (connection timeout) and github.com/Gartner does
      not exist (HTTP 404).
    url: https://api.github.com/orgs/Gartner
    status: 404
  - finding: >-
      www.gartner.com serves a Cloudflare managed challenge (HTTP 403, cf-mitigated:
      challenge) to every non-browser client, including WebFetch, on every path except
      /.well-known/security.txt. Marketing and policy pointers on that host are therefore
      recorded as live-but-unverified rather than dead.
    url: https://www.gartner.com/llms.txt
    status: 403
