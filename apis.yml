aid: gartner
name: Gartner
description: >-
  Gartner, Inc. (NYSE IT) is a global research and advisory firm selling syndicated
  research, analyst inquiry, benchmarking, peer communities and conferences to
  executives across IT, finance, HR, supply chain, marketing, sales, legal and customer
  service. Gartner publishes no public developer API, developer portal or
  machine-readable contract: the research library and the Peer Insights vendor portal
  are subscription-gated, and the one live first-party API host found by probe
  (gapi.gartner.com, an AWS API Gateway) rejects every anonymous request. Gartner sold
  its Digital Markets business - Capterra, GetApp and Software Advice, and the Buyer
  Discovery API that serves their intent data - to G2 in February 2026, so the only
  OpenAPI reachable on a gartner.com host belongs to G2. This repository tracks the
  company and any first-party technical artifact that surfaces over time.
